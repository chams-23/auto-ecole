<div class="landing landing--cars">
  <header class="landing__nav">
    <div class="landing__brand">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 30.5h28l-1.6-5.2a4 4 0 0 0-3.8-2.8H15.4a4 4 0 0 0-3.8 2.8L10 30.5Z" fill="currentColor" opacity=".95"/>
          <path d="M14.2 22.5 16.8 16a2.8 2.8 0 0 1 2.6-1.7h9.2a2.8 2.8 0 0 1 2.6 1.7l2.6 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="16.5" cy="32.5" r="3.2" fill="#0c1118" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="31.5" cy="32.5" r="3.2" fill="#0c1118" stroke="currentColor" stroke-width="1.6"/>
          <path d="M21 18.2h6" stroke="#0c1118" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
        </svg>
      </div>
      <span class="school-name">Auto-<em>École</em></span>
    </div>
    <div class="landing__nav-actions">
      <a class="btn" routerLink="/inscription">S’inscrire</a>
      <a class="btn btn-primary" routerLink="/signin">Se connecter</a>
    </div>
  </header>

  <main class="landing__stage">
    <div class="landing__hero">
      <p class="landing__eyebrow">Salon de conduite · Maroc</p>
      <h1 class="landing__title">
        Auto-<em>École</em>
      </h1>
      <p class="landing__lead">
        Gérez candidats, planning, véhicules et trésorerie dans un espace privé,
        précis et pensé pour les auto-écoles modernes.
      </p>
      <div class="landing__cta">
        <a class="btn btn-primary" routerLink="/inscription">Inscription élève</a>
        <a class="btn" routerLink="/signin">Se connecter</a>
      </div>
    </div>

    <div class="landing__gallery" aria-hidden="true">
      <figure class="landing__shot landing__shot--main">
        <img
          src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1200&q=80"
          alt=""
        />
      </figure>
      <figure class="landing__shot landing__shot--side">
        <img
          src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=800&q=80"
          alt=""
        />
      </figure>
      <figure class="landing__shot landing__shot--low">
        <img
          src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=80"
          alt=""
        />
      </figure>
    </div>
  </main>

  <footer class="landing__foot">
    <span>Formation · Conformité · Pilotage</span>
  </footer>
</div>
